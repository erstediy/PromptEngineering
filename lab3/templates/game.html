<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Последний огонь маяка</title><link rel="stylesheet" href="/static/game.css">
<header><div class="scenery" aria-hidden="true"><i></i><b></b></div><div class="mast"><h1>Последний огонь маяка</h1><p id="subtitle">Приключение для 1–3 игроков</p></div></header>
<main><section id="setup"><h2>Кто отправится к маяку?</h2><p>Выберите героев. Каждый получает три очка здоровья и +3 к своему умению.</p>
<form id="party"><div class="cards">{% for name, info in heroes.items() %}<label><input type="checkbox" value="{{ name }}" {% if loop.first %}checked{% endif %}><strong>{{ name }}</strong><span>{{ info[0] }} · {{ info[1] }}</span></label>{% endfor %}</div><button>Начать приключение</button></form></section>
<div id="table" hidden><article><h2 id="place"></h2><div id="story" aria-live="polite"></div>
<form id="move"><label>Ходит <select id="hero"></select></label><label for="action">Что ты делаешь?</label><textarea id="action" maxlength="600" required placeholder="Спрашиваю смотрителя о колоколе…"></textarea><button id="send">Передать ход мастеру</button></form>
<p id="ending"></p></article><aside><h2>Отряд</h2><div id="hp"></div><h2>Вещи</h2><div id="bag"></div><h2>Броски</h2><div id="rolls"></div><button id="restart" class="minor">Новая партия</button></aside></div><p role="status" id="status"></p></main><script src="/static/game.js"></script></html>
